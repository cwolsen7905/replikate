# GitLab CI for merge requests. GitHub Actions (.github/workflows/ci.yaml) still builds and
# publishes the image from each mirror after a merge; this file only gates the merge itself.

stages: [test]

# MR pipelines only: one pipeline per push to an MR branch, and none on main, where GitHub
# Actions takes over through the mirror.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

include:
  # The merge sign-off gate: an Approve or a thumbs-up from an owner before merge
  # (ubixcore docs/ci-require-approval.md). Runs in .post, after the checks below.
  # Pinned to a uBixCore main commit: no release ships the include yet (v0.47.0 predates
  # it). e2c10f50 includes 1bd23947, so only UBIX_APPROVAL_OWNERS' Approve/👍 counts, the
  # author included. Switch to the first v* tag after v0.47.0 once there is one.
  - project: ubixsys/ubixcore
    ref: e2c10f50742a3c78b53c235427c86b1e2e0ddd45
    file: ci/require-approval.yml

variables:
  UBIX_APPROVAL_OWNERS: "cwolsen"

# The instance's k8s runner takes tagged jobs only and runs each job's image.
# Fail closed (as in ubixvault): the shared script passes as UNVERIFIED when it has no
# token or cannot reach GitLab, which would let an unsigned MR merge. The before_script
# refuses to run without a token, and wraps the script's `bash` call so an UNVERIFIED
# result fails the job. Drop this once uBixCore's script can fail closed by itself.
require-approval:
  tags: [k8s]
  before_script:
    - '[ -n "${APPROVAL_GITLAB_TOKEN:-${AI_REVIEW_GITLAB_TOKEN:-}}" ] || { echo "require-approval: FAILED: no APPROVAL_GITLAB_TOKEN or AI_REVIEW_GITLAB_TOKEN, so the sign-off cannot be checked; failing closed."; exit 1; }'
    - command -v bash >/dev/null 2>&1 || apk add --no-cache bash >/dev/null
    - |
      bash() {
        out="$(command bash "$@")" && rc=0 || rc=$?
        printf '%s\n' "$out"
        case "$out" in *UNVERIFIED*)
          echo "require-approval: FAILED: the sign-off could not be verified; failing closed. Retry the job."; return 1 ;;
        esac
        return "$rc"
      }

# The same checks as the GitHub build job, short of the envtest integration tests (they
# download control-plane binaries; GitHub still runs them after merge). A pipeline also
# needs at least one job outside .post to start at all.
go-check:
  stage: test
  image: golang:1.23
  tags: [k8s]
  script:
    - go vet ./...
    - go build ./...
    - go test ./...
